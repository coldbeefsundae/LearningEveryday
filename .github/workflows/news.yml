# Put this file in your repo at:  .github/workflows/news.yml
# and keep fetch-news.mjs at the top level of the repo (next to index.html).
#
# Every morning it opens the CBC Kids News front page in Chrome, waits for the story list to
# appear, reads the top story and saves it as news.json in the repo.
# You can also run it by hand: Actions tab > "Daily kids news" > Run workflow.
name: Daily kids news

on:
  schedule:
    - cron: '15 11 * * *'   # 11:15 UTC, about 6:15 am Toronto
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Open the front page in Chrome and wait for the stories
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)"
          echo "Using: $CHROME"
          npm install --no-save --no-audit --no-fund puppeteer-core@23
          cat > render-front.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import { writeFileSync } from 'node:fs';
          const exe = process.env.CHROME_BIN;
          const sel = 'a[href*="/kidsnews/post/"]';
          const browser = await puppeteer.launch({
            executablePath: exe,
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage', '--disable-gpu'],
          });
          try {
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 1800 });
            await page.goto('https://www.cbc.ca/kidsnews', { waitUntil: 'domcontentloaded', timeout: 60000 });
            try { await page.waitForSelector(sel, { timeout: 25000 }); }
            catch (e) { console.log('No story links showed up within 25 seconds'); }
            // let the rest of the list finish loading, and scroll once so lazy lists appear
            await new Promise((r) => setTimeout(r, 2500));
            await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
            await new Promise((r) => setTimeout(r, 2500));
            const hrefs = await page.$$eval(sel, (as) => as.map((a) => a.getAttribute('href')));
            console.log('story links on the rendered page: ' + hrefs.length);
            console.log('first few: ' + hrefs.slice(0, 6).join(' , '));
            if (!hrefs.length) {
              console.log('page title: ' + (await page.title()));
              console.log('page text starts: ' + (await page.evaluate(() => document.body.innerText.slice(0, 400).replace(/\s+/g, ' '))));
            }
            writeFileSync('front.html', await page.content());
          } finally {
            await browser.close();
          }
          EOF
          CHROME_BIN="$CHROME" node render-front.mjs || echo "Browser step failed; the next step will try a plain download"
          ls -la front.html || true
      - name: Fetch the top story
        run: node fetch-news.mjs news.json
      - name: Save it if it changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add news.json
            git commit -m "Daily kids news"
            git push
          else
            echo "Nothing new today."
          fi
