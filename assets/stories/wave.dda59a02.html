<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;overflow:hidden}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;color:#eef2ff;-webkit-tap-highlight-color:transparent}
/* ---------- story moment ---------- */
#stage{position:fixed;inset:0;z-index:1000;background:#040714;overflow:hidden;opacity:0;touch-action:none;user-select:none;-webkit-user-select:none}
#stage[hidden]{display:none}
#stage .blur{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .6s}
#frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;border-radius:18px;box-shadow:0 0 0 3px #e2c060,0 0 0 6px #050505,0 0 40px rgba(140,205,255,.55)}
#scv{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx,#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sky{position:fixed;z-index:1002}
#dive{position:fixed;z-index:1001;background:center/cover no-repeat;border-radius:12px;pointer-events:none;transform-origin:0 0}
.cap{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,560px);background:rgba(8,12,40,.82);border:2px solid rgba(255,230,150,.7);border-radius:18px;padding:12px 16px;text-align:center;opacity:0;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.cap .yr{display:inline-block;font-weight:900;color:#2a1a00;background:#ffd84d;border-radius:99px;padding:2px 10px;font-size:14px;margin-bottom:6px}
.cap .en{font-weight:800;font-size:clamp(16px,2.6vw,21px);line-height:1.3}
.cap .ja{font-size:clamp(14px,2.2vw,18px);opacity:.9;margin-top:6px;line-height:1.45}
.cap.big .en{font-size:clamp(22px,4vw,34px);color:#ffe9a3}
#skip{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:5;font:inherit;font-weight:800;border:0;border-radius:99px;padding:9px 14px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer}
#hint{position:absolute;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;opacity:.6;white-space:nowrap}
/* sideways screens: picture on the left at full height, words beside it (they never cover the picture) */
#stage.side #frame{left:var(--fl);transform:translateY(-50%)}
#stage.side .cap{left:var(--cx);width:var(--cw);bottom:auto;top:50%;transform:translate(-50%,-50%)}
#stage.side #hint{left:var(--cx)}
#stage.side .cap.big .en{font-size:clamp(20px,3vw,32px)}

#dive .dvi{position:absolute;inset:0;background:center/cover no-repeat;transform-origin:50% 45%}
#dive.fly{background:none!important;overflow:hidden}
</style></head><body>

  <div class="blur" id="blur"></div>

    <canvas id="scv"></canvas>
  </div>
  <canvas id="fx"></canvas>
  <div class="cap" id="cap"><div class="yr"></div><div class="en"></div><div class="ja"></div></div>
  <div id="hint">tap = next part</div>
  <button id="skip">Skip ✕</button>
</div>
<canvas id="sky" hidden></canvas>
<div id="dive" hidden></div>

var idle = {run: false, size: function(){}}; function idleOn(){} function idleOff(){}
document.addEventListener('visibilitychange', function(){ if(document.hidden){ idleOff(); musStop(.1); if(!$('stage').hidden) end(); } else if($('stage').hidden) idleOn(); });


/* ---------- the story (tap = next part) ---------- */

var SIDE = false;

  /* sideways (landscape): the picture goes on the left at full screen height and the words sit beside it */
  var room = W - w, cw = Math.min(560, room - 60);

async function playStory(fromEl){
  var id = ++RUN; idleOff(); finishAll(); resetAnims();
  var st = $('stage'); st.hidden = false; scReset(); $('cap').style.opacity = 0; $('fx').style.opacity = '';

var GLOWS = {window: {sc: 1, x: 85, y: 15, r: 16, col: '255,250,230', a: .45}, brush: {sc: 1, x: 45, y: 52, r: 8, col: '150,190,255', a: .5},

  {pan: [[1.35, '45% 45%'], [1.12, '82% 18%'], 4600], glows: [['brush', [.3, .8, .5], 2300, {iterations: 2}], ['window', [.3, .8, .6], 4600]],

   out: {pan: [2.5, '85% 15%'], up: true}},
  {pan: [[1.45, '50% 60%'], [1.1, '45% 20%'], 4600], glows: [['fuji', [.2, .9, .6], 3000], ['crest', [.2, .6, .4], 4600]],
   on: function(id){ emitter(id, 70, function(r){ for(var i = 0; i < 2; i++) fx.add({x: r.left + r.width*rnd(.05, .8), y: r.top + r.height*rnd(.04, .25), vx: rnd(30, 90), vy: rnd(60, 160), r: rnd(1, 2.5), life: 1.4, l0: 1.4, fade: .6, col: '235,245,255'}); }); },
   out: {pan: [2.3, '50% 35%']}},
  {pan: [[1.3, '50% 12%'], [1.1, '55% 55%'], 4600], glows: [['prints', [.2, .6, .4], 4600], ['printer', [.3, .7, .5], 2300, {iterations: 2}]],
   on: function(id){ emitter(id, 220, function(r){ fx.add({x: r.left + r.width*rnd(.05, .95), y: r.top + r.height*rnd(.02, .3), vx: rnd(-6, 6), vy: rnd(8, 20), r: rnd(.8, 1.6), life: 2.4, l0: 2.4, fade: 1, col: '150,190,255', tw: 4, ph: rnd(0, 6)}); }); }}

var END = {pan: [[1.3, '60% 20%'], [1, '50% 50%']], on: function(id){ var n = 0;

/* ---------- story runner: a card lists its parts, the runner does the timing ----------

}
