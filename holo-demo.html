<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>StarQuest holo demo</title>
<style>
:root{--k:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0b0e2a;color:#e9e9ff;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:18px 16px 40px;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#26247a 0,#0b0e2a 70%)}
h1{margin:0 0 4px;font-size:22px;font-weight:900;letter-spacing:.02em}
.sub{margin:0 0 14px;opacity:.75;font-size:14px;line-height:1.4}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:18px;font-size:14px;font-weight:700}
.bar input[type=range]{width:140px;vertical-align:middle}
.btn{border:0;border-radius:99px;padding:8px 14px;font:inherit;font-weight:800;background:#ffd966;color:#2a1d00;cursor:pointer}
.stat{opacity:.7;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;max-width:980px}
.cell{text-align:center}
.lab{margin-top:10px;font-weight:900;font-size:15px}
.lab small{display:block;font-weight:600;opacity:.65;font-size:12px;margin-top:2px}
/* ---- card ---- */
.tcgbox{container-type:inline-size;width:100%;aspect-ratio:5/7;position:relative;cursor:pointer;
  transform:perspective(900px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .08s linear;will-change:transform}
.tcg{position:absolute;inset:0;font-size:6.4cqw;border-radius:1.2em;padding:.42em;overflow:hidden;
  background:linear-gradient(135deg,#fff0b0,#e8b43c 55%,#a9731a);
  box-shadow:0 .5em 1.4em -.3em rgba(0,0,0,.7),inset 0 0 0 .08em rgba(255,255,255,.55)}
.tcg-in{position:relative;height:100%;border-radius:.9em;overflow:hidden;background:#10163f;isolation:isolate}
.pkart-svg{display:block;width:100%;height:100%}
.L{position:absolute;inset:0;pointer-events:none}
/* gold frame glint (A, S, SSR) */
.fglint{z-index:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.95) 47%,rgba(255,250,220,.5) 53%,transparent 66%);
  background-size:300% 300%;background-position:calc(var(--mx)*100%) calc(var(--my)*100%);opacity:calc(.9*var(--k))}
.tcg-in{z-index:1}
/* rainbow holo foil (S, SSR) */
.holo{background:
   repeating-linear-gradient(-45deg,rgba(0,0,0,.55) 0 1.2px,transparent 1.2px 4px),
   repeating-linear-gradient(110deg,#ff7773 0%,#ffed5f 7%,#a8ff5f 14%,#83fff7 21%,#7894ff 28%,#d875ff 35%,#ff7773 42%);
  background-size:100% 100%,400% 400%;
  background-position:0 0,calc(var(--mx)*100%) calc(var(--my)*100%);
  mix-blend-mode:color-dodge;opacity:calc(var(--ho,.42)*var(--k));
  -webkit-mask-image:radial-gradient(circle at 50% 44.3%,transparent 0 27cqw,#000 31cqw);
          mask-image:radial-gradient(circle at 50% 44.3%,transparent 0 27cqw,#000 31cqw)}
/* moving glare (all foil tiers) */
.glare{background:radial-gradient(circle at calc(var(--mx)*100%) calc(var(--my)*100%),rgba(255,255,255,.85) 0,rgba(255,255,255,.25) 22%,transparent 52%);
  mix-blend-mode:overlay;opacity:calc(var(--go,.6)*var(--k))}
/* sparkles that light up where the light hits (SSR) */
.spark{mix-blend-mode:color-dodge;opacity:calc(1*var(--k));
  -webkit-mask-image:radial-gradient(circle at calc(var(--mx)*100%) calc(var(--my)*100%),#000 0,transparent 42%);
          mask-image:radial-gradient(circle at calc(var(--mx)*100%) calc(var(--my)*100%),#000 0,transparent 42%)}
.spark i{position:absolute;width:3.2cqw;height:3.2cqw;margin:-1.6cqw;background:
  radial-gradient(circle,#fff 0 12%,transparent 13%),
  linear-gradient(0deg,transparent 46%,#fff 50%,transparent 54%),
  linear-gradient(90deg,transparent 46%,#fff 50%,transparent 54%);
  animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.35);opacity:.4}50%{transform:scale(1);opacity:1}}
/* tiers */
.t-matte .fglint,.t-matte .holo,.t-matte .glare,.t-matte .spark{display:none}
.t-matte .tcg{background:linear-gradient(135deg,#e9dcb0,#c9a256 55%,#8e6a2a)}
.t-foil .holo,.t-foil .spark{display:none}
.t-foil{--go:.45}
.t-holo .spark{display:none}
.t-holo{--ho:.42;--go:.6}
.t-ssr{--ho:.62;--go:.75}
.t-ssr .tcg{background:
   linear-gradient(115deg,#fff3c0,#ffb3d9 20%,#b6f0ff 40%,#fff3c0 55%,#c9b6ff 75%,#ffe08a);
   background-size:300% 300%;background-position:calc(var(--mx)*100%) calc(var(--my)*100%)}
/* big view */
.big{position:fixed;inset:0;background:rgba(5,6,20,.88);display:none;place-items:center;z-index:9;touch-action:none}
.big.on{display:grid}
.big .tcgbox{width:min(78vw,calc(80vh*5/7));cursor:grab}
.big .hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;opacity:.7;font-size:14px;font-weight:700}
@media (prefers-reduced-motion:reduce){.spark i{animation:none}}
</style></head>
<body>
<h1>✨ StarQuest holo demo</h1>
<p class="sub">Tilt the tablet, or tap a card to see it big and drag your finger across it.<br>This page is only a demo and does not change the app.</p>
<div class="bar">
  <label>Shine strength <input id="k" type="range" min="0.3" max="1.6" step="0.05" value="1"></label>
  <label><input id="drift" type="checkbox" checked> Gentle shimmer when still</label>
  <button class="btn" id="perm" hidden>Turn on tilt</button>
  <span class="stat" id="stat">Tilt: waiting…</span>
</div>
<div class="grid" id="grid"></div>
<div class="big" id="big"><div id="bigslot"></div><div class="hint">Drag across the card · tap outside to close</div></div>
<script>
var PK_UID = 0;
var PK_KIT = '<g><g><path d="M24 50L20 10l34 20z" fill="#ff8a3d"/><path d="M29 42L27 20l16 10z" fill="#ffd2ad"/></g><g><path d="M96 50l4-40-34 20z" fill="#ff8a3d"/><path d="M91 42l2-22-16 10z" fill="#ffd2ad"/></g><path d="M60 28c26 0 40 16 44 34-6-2-10 0-12 4 4 2 6 6 6 10-6-2-10 0-12 4-6 12-16 18-26 18s-20-6-26-18c-2-4-6-6-12-4 0-4 2-8 6-10-2-4-6-6-12-4 4-18 18-34 44-34z" fill="#ff8a3d"/><path d="M60 63c12 0 26 8 24 18-6 12-14 17-24 17s-18-5-24-17c-2-10 12-18 24-18z" fill="#fff6ea"/><ellipse cx="60" cy="72" rx="5.4" ry="3.8" fill="#3b2a4a"/><circle cx="36" cy="72" r="5" fill="#ff9fb0" opacity=".55"/><circle cx="84" cy="72" r="5" fill="#ff9fb0" opacity=".55"/><g><g><circle cx="46" cy="60" r="4.6" fill="#3b2a4a"/><circle cx="47.5" cy="58.3" r="1.6" fill="#fff"/></g><g><circle cx="74" cy="60" r="4.6" fill="#3b2a4a"/><circle cx="75.5" cy="58.3" r="1.6" fill="#fff"/></g></g><g><path d="M52 80q8 8 16 0" fill="none" stroke="#3b2a4a" stroke-width="3" stroke-linecap="round"/></g><path d="M32 100q28 12 56 0l5 12q-33 14-66 0z" fill="#6c5ce7"/><path d="M80 106l8 14-9 2-5-12z" fill="#5648c9"/></g>';
function pkStar(cx, cy, R, fill, op){
  var pts = [];
  for(var i = 0; i < 10; i++){ var r = i % 2 ? R * .45 : R, a = -Math.PI/2 + i*Math.PI/5; pts.push((cx + r*Math.cos(a)).toFixed(1)+','+(cy + r*Math.sin(a)).toFixed(1)); }
  return '<polygon points="'+pts.join(' ')+'" fill="'+fill+'"'+(op ? ' opacity="'+op+'"' : '')+'/>';
}
function pkDots(n, w, y0, y1, seed){
  var h = '', x = seed;
  function rnd(){ x = (x * 1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; }
  for(var i = 0; i < n; i++){ var px = 8 + rnd()*(w-16), py = y0 + rnd()*(y1-y0), r = .5 + rnd()*1.1; h += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+r.toFixed(2)+'" fill="#fff" opacity="'+(.35 + rnd()*.6).toFixed(2)+'"/>'; }
  return h;
}
function pkRays(cx, cy, n, len, op){
  var h = '';
  for(var i = 0; i < n; i++){ var a0 = i*2*Math.PI/n, a1 = a0 + Math.PI/n*.45; h += '<polygon points="'+cx+','+cy+' '+(cx+len*Math.cos(a0)).toFixed(1)+','+(cy+len*Math.sin(a0)).toFixed(1)+' '+(cx+len*Math.cos(a1)).toFixed(1)+','+(cy+len*Math.sin(a1)).toFixed(1)+'" fill="#ffe28a" opacity="'+op+'"/>'; }
  return h;
}
function pkDefs(u){
  return '<defs>'+
    '<linearGradient id="'+u+'bg" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#10163f"/><stop offset=".55" stop-color="#2a2a86"/><stop offset="1" stop-color="#4b2a8f"/></linearGradient>'+
    '<radialGradient id="'+u+'gl" cx=".5" cy=".48" r=".62"><stop offset="0" stop-color="#7a6bff" stop-opacity=".95"/><stop offset=".55" stop-color="#3a2fa0" stop-opacity=".55"/><stop offset="1" stop-color="#10163f" stop-opacity="0"/></radialGradient>'+
    '<linearGradient id="'+u+'gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c0"/><stop offset=".5" stop-color="#f0bf45"/><stop offset="1" stop-color="#b87a1c"/></linearGradient>'+
    '<linearGradient id="'+u+'gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c0"/><stop offset=".55" stop-color="#f0bf45"/><stop offset="1" stop-color="#c28a24"/></linearGradient>'+
    '<radialGradient id="'+u+'pl" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#ffe8c2"/><stop offset="1" stop-color="#ffb36b"/></radialGradient>'+
    '<filter id="'+u+'bl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2"/></filter>'+
    '<filter id="'+u+'sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2.4" stdDeviation="2.2" flood-color="#6e3210" flood-opacity=".5"/></filter>'+
    '<filter id="'+u+'ts" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="1.2" stdDeviation=".9" flood-color="#000" flood-opacity=".6"/></filter>'+
    '<pattern id="'+u+'cr" width="5" height="14" patternUnits="userSpaceOnUse"><rect width="5" height="14" fill="#0c1033"/><rect x="1" width="1.2" height="14" fill="#fff" opacity=".13"/><rect x="3" width="1.2" height="14" fill="#000" opacity=".4"/></pattern>'+
  '</defs>';
}
function packArtSVG(){
  var u = 'pk'+(PK_UID++), cx = 115, cy = 156, g = 'url(#'+u+'gd)';
  var h = '<svg class="pkart-svg" viewBox="0 0 230 322" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+pkDefs(u);
  h += '<rect width="230" height="322" fill="url(#'+u+'bg)"/><rect width="230" height="322" fill="url(#'+u+'gl)"/>';
  h += pkRays(cx, cy, 36, 330, .09) + pkDots(46, 230, 22, 300, 11);
  var top = [[26,86],[56,64],[92,74],[130,56],[168,70],[200,88]], bot = [[24,236],[60,254],[96,244],[132,256],[170,242],[204,230]];
  [top, bot].forEach(function(P){
    var d = ''; P.forEach(function(q, k){ d += (k ? 'L' : 'M')+q[0]+' '+q[1]; });
    h += '<path d="'+d+'" fill="none" stroke="#ffe28a" stroke-opacity=".5" stroke-width=".9"/>';
    P.forEach(function(q){ h += pkStar(q[0], q[1], 4.6, g); });
  });
  h += '<circle cx="'+cx+'" cy="'+cy+'" r="76" fill="none" stroke="#ffd966" stroke-width="5" opacity=".8" filter="url(#'+u+'bl)"/>';
  h += '<circle cx="'+cx+'" cy="'+cy+'" r="73" fill="url(#'+u+'pl)"/>';
  h += '<circle cx="'+cx+'" cy="'+cy+'" r="73" fill="none" stroke="'+g+'" stroke-width="5"/>';
  h += '<circle cx="'+cx+'" cy="'+cy+'" r="70" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".8"/>';
  h += '<circle cx="'+cx+'" cy="'+cy+'" r="75.6" fill="none" stroke="#7a4d0b" stroke-opacity=".55" stroke-width=".7"/>';
  h += '<svg x="'+(cx-60)+'" y="'+(cy-66)+'" width="120" height="124" viewBox="0 0 120 124" filter="url(#'+u+'sh)">'+PK_KIT+'</svg>';
  h += '<text x="115" y="41" text-anchor="middle" font-size="25" font-weight="900" letter-spacing="3.2" fill="url(#'+u+'gv)" stroke="#8a5a0e" stroke-width=".5" filter="url(#'+u+'ts)">STARQUEST</text>';
  h += '<text x="115" y="278" text-anchor="middle" font-size="15.5" font-weight="900" letter-spacing="2.4" fill="url(#'+u+'gv)" stroke="#8a5a0e" stroke-width=".4" filter="url(#'+u+'ts)">HISTORY HEROES</text>';
  h += '<text x="115" y="297" text-anchor="middle" font-size="8.4" font-weight="800" letter-spacing="1.8" fill="#d6d9ff" opacity=".85">A PACK OF '+CARDS_PER_PACK+' CARDS</text>';
  h += '<rect width="230" height="13" fill="url(#'+u+'cr)"/><rect y="309" width="230" height="13" fill="url(#'+u+'cr)"/>';
  h += '<rect y="12" width="230" height="1.2" fill="#fff" opacity=".18"/><rect y="309" width="230" height="1.2" fill="#fff" opacity=".18"/>';
  return h + '</svg>';
}
function backArtSVG(){
  var u = 'pk'+(PK_UID++), cx = 100, cy = 124, g = 'url(#'+u+'gd)';
  var h = '<svg class="pkart-svg" viewBox="0 0 200 280" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+pkDefs(u);
  h += '<rect width="200" height="280" fill="url(#'+u+'bg)"/><rect width="200" height="280" fill="url(#'+u+'gl)"/>';
  h += pkRays(cx, cy, 30, 300, .09) + pkDots(34, 200, 10, 270, 23);
  var top = [[22,52],[50,34],[84,44],[116,30],[150,42],[178,56]];
  var d = ''; top.forEach(function(q, k){ d += (k ? 'L' : 'M')+q[0]+' '+q[1]; });
  h += '<path d="'+d+'" fill="none" stroke="#ffe28a" stroke-opacity=".5" stroke-width=".9"/>';
  top.forEach(function(q){ h += pkStar(q[0], q[1], 4.2, g); });
  h += '<circle cx="'+cx+'" cy="'+cy+'" r="66" fill="none" stroke="#ffd966" stroke-width="5" opacity=".75" filter="url(#'+u+'bl)"/>';
  h += '<circle cx="'+cx+'" cy="'+cy+'" r="63" fill="url(#'+u+'pl)"/>';
  h += '<circle cx="'+cx+'" cy="'+cy+'" r="63" fill="none" stroke="'+g+'" stroke-width="4.5"/>';
  h += '<circle cx="'+cx+'" cy="'+cy+'" r="60" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".7"/>';
  h += '<svg x="'+(cx-52)+'" y="'+(cy-57)+'" width="104" height="107.5" viewBox="0 0 120 124" filter="url(#'+u+'sh)">'+PK_KIT+'</svg>';
  h += '<text x="100" y="222" text-anchor="middle" font-size="19" font-weight="900" letter-spacing="2.6" fill="url(#'+u+'gv)" stroke="#8a5a0e" stroke-width=".4" filter="url(#'+u+'ts)">STARQUEST</text>';
  h += '<text x="100" y="242" text-anchor="middle" font-size="10.5" font-weight="900" letter-spacing="2" fill="url(#'+u+'gv)" stroke="#8a5a0e" stroke-width=".3">HISTORY HEROES</text>';
  h += pkStar(100, 260, 4.4, g);
  return h + '</svg>';
}

var TIERS = [
  ['matte','C and B','Plain matte back'],
  ['foil','A','Gold foil glint on the border'],
  ['holo','S','Rainbow holo foil'],
  ['ssr','SSR','Prismatic holo with sparkles']
];
function sparks(){
  var h = '', x = 7; function r(){ x = (x*1103515245+12345)&0x7fffffff; return x/0x7fffffff; }
  for(var i=0;i<34;i++) h += '<i style="left:'+(4+r()*92).toFixed(1)+'%;top:'+(4+r()*92).toFixed(1)+'%;animation-delay:-'+(r()*1.8).toFixed(2)+'s;transform:scale('+(.4+r()*.6).toFixed(2)+')"></i>';
  return h;
}
function cardHTML(t){
  return '<div class="tcgbox t-'+t+'" data-t="'+t+'"><div class="tcg"><div class="L fglint"></div><div class="tcg-in">'+backArtSVG()+
    '<div class="L holo"></div><div class="L spark">'+sparks()+'</div><div class="L glare"></div></div></div></div>';
}
var grid = document.getElementById('grid');
grid.innerHTML = TIERS.map(function(t){ return '<div class="cell">'+cardHTML(t[0])+'<div class="lab">'+t[1]+'<small>'+t[2]+'</small></div></div>'; }).join('');

/* ---- light position: pointer > tilt > drift ---- */
var S = {x:.5,y:.5}, T = {x:.5,y:.5}, mode = 'drift', tiltSeen = false, base = null, ptr = null;
var stat = document.getElementById('stat'), K = document.getElementById('k'), D = document.getElementById('drift');
K.oninput = function(){ document.documentElement.style.setProperty('--k', K.value); };
function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
function onTilt(e){
  if(e.beta == null) return;
  var ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  var lr = e.gamma, fb = e.beta;
  if(ang == 90){ lr = e.beta; fb = -e.gamma; } else if(ang == -90 || ang == 270){ lr = -e.beta; fb = e.gamma; } else if(ang == 180){ lr = -e.gamma; fb = -e.beta; }
  if(!base) base = {lr:lr, fb:fb};
  base.lr += (lr - base.lr)*.004; base.fb += (fb - base.fb)*.004;   /* slowly re-centre to how it is held */
  T.x = clamp(.5 + (lr - base.lr)/36); T.y = clamp(.5 + (fb - base.fb)/36);
  if(!tiltSeen){ tiltSeen = true; stat.textContent = 'Tilt: on'; }
}
window.addEventListener('deviceorientation', onTilt);
var DOE = window.DeviceOrientationEvent;
if(DOE && typeof DOE.requestPermission === 'function'){
  var pb = document.getElementById('perm'); pb.hidden = false;
  pb.onclick = function(){ DOE.requestPermission().then(function(r){ if(r === 'granted') pb.hidden = true; }).catch(function(){}); };
}
setTimeout(function(){ if(!tiltSeen) stat.textContent = location.protocol === 'https:' ? 'Tilt: no sensor found (drag still works)' : 'Tilt: needs the https site (drag still works)'; }, 2000);

var big = document.getElementById('big'), slot = document.getElementById('bigslot');
grid.addEventListener('click', function(e){
  var c = e.target.closest('.tcgbox'); if(!c) return;
  slot.innerHTML = cardHTML(c.getAttribute('data-t')); big.classList.add('on');
});
big.addEventListener('click', function(e){ if(!e.target.closest('.tcgbox')){ big.classList.remove('on'); slot.innerHTML = ''; ptr = null; } });
big.addEventListener('pointermove', function(e){
  var c = slot.querySelector('.tcgbox'); if(!c) return;
  var r = c.getBoundingClientRect();
  if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom){ ptr = null; return; }
  ptr = {x:(e.clientX - r.left)/r.width, y:(e.clientY - r.top)/r.height};
});
big.addEventListener('pointerup', function(e){ if(e.pointerType !== 'mouse') ptr = null; });
big.addEventListener('pointerleave', function(){ ptr = null; });

var t0 = performance.now();
function frame(now){
  var tx, ty, rot = 0;
  if(ptr){ tx = ptr.x; ty = ptr.y; rot = 14; }
  else if(tiltSeen){ tx = T.x; ty = T.y; rot = 4; }
  else if(D.checked){ var t = (now - t0)/1000; tx = .5 + .32*Math.sin(t*.55); ty = .5 + .26*Math.sin(t*.37 + 1); rot = 8; }
  else { tx = .5; ty = .5; }
  S.x += (tx - S.x)*.14; S.y += (ty - S.y)*.14;
  var cards = document.querySelectorAll('.tcgbox');
  for(var i=0;i<cards.length;i++){
    var s = cards[i].style;
    s.setProperty('--mx', S.x.toFixed(4)); s.setProperty('--my', S.y.toFixed(4));
    s.setProperty('--ry', ((S.x - .5)*rot).toFixed(2)+'deg'); s.setProperty('--rx', ((.5 - S.y)*rot).toFixed(2)+'deg');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
