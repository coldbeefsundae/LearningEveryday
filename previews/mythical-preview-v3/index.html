<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>StarQuest · Mythical preview v3 · Pegasus</title>
<style>
:root{--gold:#d9bb72;--gold2:#f3dfa6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#efe7d2}
body{display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:relative;width:min(100vw,calc(100vh*0.5625));height:min(100vh,calc(100vw*1.7778));overflow:hidden;background:#000;--W:min(100vw,calc(100vh*0.5625))}
.stage>*{position:absolute}
img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.serif{font-family:"Cormorant Garamond","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif}
.jaf{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif}

/* ---------- intro layers ---------- */
#skyW{inset:-4%;opacity:0;transform:translateY(-2.5%) scale(1.04)}
#skyW img{width:100%;height:100%;object-fit:cover}
#oneStar{left:64%;top:16%;width:5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;background:radial-gradient(circle,#fff 0%,#fff 8%,rgba(215,228,255,.55) 22%,transparent 62%)}
#oneStar:before,#oneStar:after{content:"";position:absolute;left:50%;top:50%;width:360%;height:5%;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent)}
#oneStar:after{transform:translate(-50%,-50%) rotate(90deg)}
#moonW{left:50%;top:8%;width:80%;aspect-ratio:1;transform:translate(-50%,235%) scale(1.12);opacity:0}
#moonW>*{position:absolute}
#rays{left:50%;top:50%;width:300%;height:300%;transform:translate(-50%,-50%);overflow:visible}
#rays g{transform-origin:0 0;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#moonGlow{left:50%;top:50%;width:240%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.32) 0%,rgba(255,236,190,.14) 20%,rgba(200,215,255,.05) 38%,transparent 60%);opacity:0}
#moonImg{inset:0;width:100%;height:100%;object-fit:contain}
#seal{left:50%;top:30.5%;width:88%;aspect-ratio:1;transform:translate(-50%,-50%);overflow:visible;opacity:0;pointer-events:none}
#threadL,#dustL{inset:0;pointer-events:none;overflow:hidden}
.spk{position:absolute;left:0;top:0;width:2.2%;aspect-ratio:1;margin:-1.1% 0 0 -1.1%;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffeec0 30%,rgba(255,215,130,.4) 50%,transparent 70%);pointer-events:none}
.spk.sm{width:1.3%;margin:-.65% 0 0 -.65%}
.ring{position:absolute;left:0;top:0;width:8%;aspect-ratio:1;margin:-4% 0 0 -4%;border-radius:50%;border:2px solid rgba(255,236,190,.8);opacity:0;pointer-events:none}
#sil{left:50%;top:30.5%;width:62%;aspect-ratio:3/4;transform:translate(-190%,-50%);opacity:0;filter:brightness(0);display:none}
#sil img{width:100%;height:100%;object-fit:cover}
#art{left:0;width:100%;aspect-ratio:3/4;top:47%;transform:translateY(-50%);pointer-events:none}
#art>*{position:absolute;inset:0;width:100%;height:100%}
#art img{object-fit:cover}
#neb{opacity:0;transform:scale(1.08)}
#cre{opacity:0;transform:scale(.97)}
#iLines{overflow:visible}
#iStars .star{transform:translate(-50%,-50%) scale(0)}
#glint{position:absolute;width:10%;height:auto;aspect-ratio:1;inset:auto;transform:translate(-50%,-50%) scale(0);opacity:0;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.6) 12%,transparent 40%),linear-gradient(90deg,transparent 46%,rgba(255,255,255,.9) 50%,transparent 54%),linear-gradient(0deg,transparent 46%,rgba(255,255,255,.9) 50%,transparent 54%)}
#bloom{inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,240,205,.9),rgba(255,215,140,.35) 30%,transparent 65%);opacity:0;pointer-events:none}
#vign{inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.lb{left:0;right:0;height:10%;background:#000;z-index:4}
#lbT{top:0}#lbB{bottom:0}
#band{left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,6,.55) 40%,rgba(0,0,6,.78));opacity:0;pointer-events:none}
#txt{left:6%;right:6%;bottom:7%;text-align:center;pointer-events:none}
.en{position:relative;overflow:hidden;font-style:italic;color:#fff6dc;font-size:calc(var(--W)*0.064);line-height:1.2;text-shadow:0 0 18px rgba(255,220,150,.45),0 2px 4px #000;padding:.05em 0}
.en.small{font-size:calc(var(--W)*0.05)}
.ja{margin-top:.6em;color:var(--gold);font-size:calc(var(--W)*0.036);line-height:1.5;text-shadow:0 2px 4px #000;opacity:0;transition:opacity 1.2s}
.w{display:inline-block;opacity:0;transform:translateY(.25em);transition:opacity .9s ease,transform .9s ease;margin-right:.22em}
.w.on{opacity:1;transform:none}
.shine{position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,236,180,.45),transparent);transform:translateX(-150%);pointer-events:none}
.tapH{margin-top:.9em;font-size:calc(var(--W)*0.03);color:#cdbf98;opacity:0;transition:opacity .8s}
#prompt{left:0;right:0;top:60%;text-align:center;opacity:0;pointer-events:none}
#prompt .en{font-size:calc(var(--W)*0.05)}

/* ---------- card ---------- */
#cardDrop{left:50%;top:45%;width:82%;aspect-ratio:2/3;transform:translate(-50%,-50%);opacity:0;visibility:hidden;perspective:1400px}
#cshadow{position:absolute;left:8%;right:8%;bottom:-5%;height:12%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.75),transparent 70%);opacity:.0}
#card{position:absolute;inset:0;transform-style:preserve-3d}
#flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.1,.2,1)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face>*{position:absolute}
.back{transform:rotateY(180deg)}
.win{left:11.33%;top:20.05%;width:77.34%;height:54.56%;overflow:hidden;border-radius:6%;background:#02040a}
.cart{position:absolute;left:0;width:100%;aspect-ratio:3/4;top:50%;transform:translateY(-50%)}
.cart>*{position:absolute;inset:0;width:100%;height:100%}
.cart img{object-fit:cover}
#csky{transform:scale(1.06)}
.cnebI{width:100%;height:100%;object-fit:cover;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}
#ccre{opacity:0}
#cLines{overflow:visible;opacity:.42}
#cnebO{opacity:.74}
#shootW{overflow:hidden;pointer-events:none}#shoot{position:absolute;left:0;top:0;width:30%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));border-radius:99px;opacity:0;transform-origin:100% 50%}
#csheen{inset:-30% !important;width:160% !important;height:160% !important;background:linear-gradient(115deg,transparent 38%,rgba(255,226,160,.14) 47%,rgba(255,246,220,.24) 50%,rgba(255,226,160,.14) 53%,transparent 62%);opacity:0}
.frame,.foil{inset:0;width:100%;height:100%}
.foil{opacity:0}
.badge{left:75.5%;top:8.46%;width:13.2%;height:5.3%;display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:calc(var(--cw)*0.042);letter-spacing:.14em;text-shadow:0 0 8px rgba(243,223,166,.5),0 1px 1px #000;padding-left:.14em}
#ptr{left:0;top:0;width:4.2%;aspect-ratio:1;margin:-2.1% 0 0 -2.1%;background:radial-gradient(circle,#fff8e0 0%,#f3d991 22%,rgba(243,217,145,.35) 45%,transparent 70%);border-radius:50%;opacity:.95}
#ptr:before,#ptr:after{content:"";position:absolute;left:50%;top:50%;width:170%;height:14%;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,#fff3c8,transparent);border-radius:50%}
#ptr:after{transform:translate(-50%,-50%) rotate(90deg)}
.ct{left:0;right:0;text-align:center;color:var(--gold2);line-height:1;text-shadow:0 1px 2px #000,0 0 10px rgba(217,187,114,.25)}
.c1{top:79.6%;font-size:calc(var(--cw)*0.052);letter-spacing:.08em}
.c2{top:86.4%;font-size:calc(var(--cw)*0.031);color:var(--gold)}
.c3{top:89.2%;font-size:calc(var(--cw)*0.022);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.bwin{left:11.33%;top:20.05%;width:77.34%;height:54.56%;border-radius:6%;overflow:hidden;background:#03050c}
.bwin>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32}
.bscroll{position:absolute;inset:0;overflow-y:auto;padding:9% 9% 10%;text-align:center;touch-action:pan-y;pointer-events:auto}
.bh{color:var(--gold2);font-size:calc(var(--cw)*0.05);letter-spacing:.1em}
.bd{color:#e9dcb5;font-size:calc(var(--cw)*0.032);margin-top:.4em}
.bdj{color:var(--gold);font-size:calc(var(--cw)*0.028);margin-top:.2em}
.bhr{height:1px;margin:7% 15%;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.bl{color:#fff3d6;font-style:italic;font-size:calc(var(--cw)*0.036);line-height:1.3;margin-top:5%}
.blj{color:var(--gold);font-size:calc(var(--cw)*0.027);line-height:1.5;margin-top:.3em}
.bbtn{margin-top:8%;font-size:calc(var(--cw)*0.034);background:rgba(20,24,40,.8);color:var(--gold2);border:1px solid #8a7440;border-radius:999px;padding:.4em 1.1em}
#award{left:0;right:0;top:82.5%;text-align:center;opacity:0;pointer-events:none}
#award .en{font-style:normal;letter-spacing:.12em;font-size:calc(var(--W)*0.048)}
#award .ja{opacity:1;margin-top:.3em}
#hint{left:0;right:0;top:83%;text-align:center;opacity:0;pointer-events:none}
#hint .en{font-size:calc(var(--W)*0.045)}
#hint .ja{opacity:1;margin-top:.3em}
#hint svg{width:calc(var(--W)*0.12);height:auto;display:block;margin:0 auto .4em;animation:rock 2.2s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
#btns{left:0;right:0;bottom:3.5%;display:flex;gap:4%;justify-content:center;opacity:0;pointer-events:none}
.btn{font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(var(--W)*0.05);color:#1b1407;background:linear-gradient(#f6e4ad,#cfa755);border:0;border-radius:999px;padding:.4em 1.3em;box-shadow:0 0 24px rgba(246,214,140,.35);letter-spacing:.05em}
.btn.ghost{background:rgba(20,26,42,.75);color:var(--gold2);border:1px solid #8a7440;box-shadow:none}

/* ---------- ui ---------- */
#start{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:6;background:#000}
#start .sub{margin-top:1em;font-size:calc(var(--W)*0.032);color:#bfb391}
#loading{font-size:calc(var(--W)*0.04);color:#cdbf98;animation:fadeP 1.6s ease-in-out infinite}
@keyframes fadeP{50%{opacity:.35}}
#go{display:none}
.link{background:none;border:0;color:#8f866b;text-decoration:underline;font-size:calc(var(--W)*0.028);margin-top:1.6em}
#skip{right:4%;top:2.5%;font-size:calc(var(--W)*0.034);background:rgba(20,26,42,.6);color:#f3dfa6;border:1px solid #6b5a2e;border-radius:999px;padding:.35em .9em;display:none;z-index:7}
#rot{inset:0;z-index:9;background:#000;display:none;align-items:center;justify-content:center;text-align:center;font-size:calc(var(--W)*0.05);color:#efe2bd}
#dbg{left:1%;top:1%;z-index:8;background:rgba(0,0,0,.78);border:1px solid #444;border-radius:8px;padding:6px;font:11px/1.3 system-ui;color:#ddd;display:none;max-width:60%}
#dbg button{font:11px system-ui;margin:1px;padding:2px 6px;background:#222;color:#eee;border:1px solid #555;border-radius:4px}
#dbg button.on{background:#7a5c1e}
.dlab{position:absolute;transform:translate(6px,-50%);font:9px system-ui;color:#ffe08a;text-shadow:0 0 2px #000;white-space:nowrap;pointer-events:none}
#dTip{position:absolute;z-index:9;font:11px system-ui;background:#000c;color:#ffe08a;padding:2px 5px;border-radius:4px;pointer-events:none;display:none}
#glintMark{position:absolute;width:5%;aspect-ratio:1;border:2px solid #f44;border-radius:50%;transform:translate(-50%,-50%);display:none}

/* star look (shared) */
.star{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.star i{position:absolute;inset:0;border-radius:50%;animation:tw var(--d) ease-in-out var(--dl) infinite}
.star.soft i{animation-name:tws}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.62}}
@keyframes tws{0%,100%{opacity:1}50%{opacity:.86}}
.star .x{position:absolute;left:50%;top:50%;width:420%;height:6%;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);border-radius:50%}
.star .x.v{transform:translate(-50%,-50%) rotate(90deg)}
.glow{position:absolute;width:60%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0;background:radial-gradient(circle,rgba(235,240,255,.55) 0%,rgba(190,210,255,.22) 30%,rgba(255,200,140,.08) 55%,transparent 70%)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="skyW"><img src="assets/skytall.webp" alt=""></div>
  <div id="oneStar"></div>
  <div id="moonW">
    <svg id="rays" viewBox="-150 -150 300 300"></svg>
    <div id="moonGlow"></div>
    <img id="moonImg" src="assets/moon.webp" alt="">
  </div>
  <svg id="seal" viewBox="-60 -60 120 120"></svg>
  <div id="sil"><img src="assets/creature.webp" alt=""></div>
  <div id="art">
    <img id="neb" src="assets/nebula.webp" alt="">
    <div id="iGlows"></div>
    <img id="cre" src="assets/creature.webp" alt="">
    <svg id="iLines" viewBox="0 0 300 400" preserveAspectRatio="none"></svg>
    <div id="iStars"></div>
    <div id="glintL"><div id="glint"></div><div id="glintMark"></div></div>
  </div>
  <div id="threadL"></div>
  <div id="bloom"></div>
  <div id="vign"></div>
  <div id="band"></div>
  <div id="txt" class="serif"></div>
  <div id="prompt"><div class="en serif">Trace the seal to awaken…</div><div class="ja jaf" style="opacity:1">封印をなぞって、めざめさせよう</div></div>

  <div id="cardDrop">
    <div id="cshadow"></div>
    <div id="card"><div id="flipper">
      <div class="face front">
        <div class="win" id="cwin"><div class="cart" id="cart">
          <img id="csky" src="assets/sky.webp" alt="">
          <div id="shootW"><div id="shoot"></div></div>
          <div id="cnebO"><img class="cnebI" src="assets/nebula.webp" alt=""></div>
          <div id="cfg">
            <div id="cGlows" style="position:absolute;inset:0"></div>
            <img id="ccre" src="assets/creature.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
            <svg id="cLines" viewBox="0 0 300 400" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"></svg>
            <div id="cStars" style="position:absolute;inset:0"></div>
          </div>
          <div id="csheen"></div>
        </div></div>
        <img class="frame" src="assets/frame.webp" alt="">
        <img class="foil" src="assets/foil0.webp" alt=""><img class="foil" src="assets/foil1.webp" alt=""><img class="foil" src="assets/foil2.webp" alt=""><img class="foil" src="assets/foil3.webp" alt="">
        <div class="badge serif">MR</div>
        <div id="ptr"></div>
        <div class="ct c1 serif">Pegasus</div><div class="ct c2 jaf">ペガスス座</div><div class="ct c3 serif">Greece · Mythical · Constellation</div>
      </div>
      <div class="face back">
        <div class="bwin"><img src="assets/sky.webp" alt=""><div class="bscroll" id="bscroll"></div></div>
        <img class="frame" src="assets/frame.webp" alt="">
        <div class="badge serif">MR</div>
        <div class="ct c1 serif">Pegasus</div><div class="ct c2 jaf">ペガスス座</div><div class="ct c3 serif">Greece · Mythical · Constellation</div>
      </div>
    </div></div>
  </div>
  <div id="award"><div class="en serif">Awakened · 1 of 12</div><div class="ja jaf">めざめた　1 / 12</div></div>
  <div id="hint"></div>
  <div id="btns"><button class="btn ghost" id="flipB">↻ Flip · うら</button><button class="btn" id="doneB">Done ✓</button></div>
  <div class="lb" id="lbT"></div><div class="lb" id="lbB"></div>

  <div id="start">
    <div id="loading" class="serif">Gathering the stars…</div>
    <button class="btn" id="go">✦ Unseal ✦</button>
    <div class="sub jaf">封印をとく</div>
    <div class="sub" id="nameNote"></div>
    <button class="link" id="reset">Reset “first time” (demo)</button>
  </div>
  <button id="skip">Skip ▸</button>
  <div id="rot"><div>Please turn your device upright ↻<br><span class="jaf" style="font-size:.8em;color:#d9bb72">たてにしてね</span></div></div>
  <div id="dbg"></div>
  <div id="dTip"></div>
</div>
<script>
(function(){
"use strict";
function showErr(m){var d=document.getElementById('errB');if(!d){d=document.createElement('div');d.id='errB';d.style.cssText='position:fixed;left:4px;right:4px;bottom:4px;z-index:99;background:#400;color:#fdd;font:11px system-ui;padding:4px;border-radius:4px';document.body.appendChild(d)}d.textContent='Error: '+m}
addEventListener('error',function(e){showErr(e.message)});addEventListener('unhandledrejection',function(e){showErr(e.reason&&e.reason.message||e.reason)});
var D={"stars":[{"n":"Alpheratz","x":0.4169,"y":0.5759,"mag":2.06,"c":"#cfe0ff"},{"n":"Scheat","x":0.4984,"y":0.4248,"mag":2.42,"c":"#ffc8a0"},{"n":"Markab","x":0.6721,"y":0.4704,"mag":2.49,"c":"#cfe0ff"},{"n":"Algenib","x":0.6006,"y":0.6341,"mag":2.83,"c":"#cfe0ff"},{"n":"Homam","x":0.7559,"y":0.4293,"mag":3.4,"c":"#cfe0ff"},{"n":"Biham","x":0.8517,"y":0.3701,"mag":3.53,"c":"#eef3ff"},{"n":"Enif","x":0.8291,"y":0.2955,"mag":2.38,"c":"#ffd9a8"},{"n":"Matar","x":0.4912,"y":0.368,"mag":2.94,"c":"#fff1d6"},{"n":"Pi","x":0.4857,"y":0.2792,"mag":4.29,"c":"#fffaf0"},{"n":"Sadalbari","x":0.5601,"y":0.4035,"mag":3.48,"c":"#ffd9a8"},{"n":"Lambda","x":0.5778,"y":0.3987,"mag":3.95,"c":"#fff1d6"},{"n":"Iota","x":0.5951,"y":0.2982,"mag":3.77,"c":"#fffaf0"},{"n":"Kappa","x":0.6145,"y":0.2438,"mag":4.13,"c":"#fffaf0"}],"lines":[["Alpheratz","Scheat"],["Scheat","Markab"],["Markab","Algenib"],["Algenib","Alpheratz"],["Markab","Homam"],["Homam","Biham"],["Biham","Enif"],["Scheat","Matar"],["Matar","Pi"],["Scheat","Sadalbari"],["Sadalbari","Lambda"],["Lambda","Iota"],["Iota","Kappa"]]};
var Q=function(id){return document.getElementById(id)};
var stage=Q('stage'),qs=new URLSearchParams(location.search);
var NAME=(qs.get('name')||'').trim()||'star';           /* from the app; never invented */
var DEBUG=qs.has('debug'),SPEED=Math.max(1,+qs.get('speed')||1),START_ACT=+qs.get('act')||0;
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var SEEN_KEY='sqMythPegasusSeen';
Q('nameNote').textContent='Name used: '+NAME+'  (demo: add ?name=… to the link)';

/* ================= timing helpers (support fast-forward + skip) ================= */
var curAct=0,ffUntil=0,pend=[];
function ff(){return curAct<ffUntil}
function act(n){curAct=n;var e=Q('dAct');if(e)e.textContent='Act '+n}
function wait(ms){return new Promise(function(r){if(ff())return r();var t=setTimeout(function(){r()},ms/SPEED);pend.push(function(){clearTimeout(t);r()})})}
function T(el,props,ms,ease,delay){var d=ff()?0:ms/SPEED;el.style.transition=d?('all '+d+'ms '+(ease||'ease-in-out')+' '+((delay||0)/SPEED)+'ms'):'none';for(var k in props)el.style[k]=props[k]}
function commit(el,f){for(var k in f)if(k!=='offset'&&k!=='easing'&&k!=='composite')el.style[k]=f[k]}
function A(el,frames,ms,opts){var last=frames[frames.length-1];
  if(ff()){el.style.transition='none';commit(el,last);return Promise.resolve()}
  opts=Object.assign({duration:ms/SPEED,easing:'ease-in-out',fill:'forwards'},opts||{});if(opts.delay)opts.delay/=SPEED;
  var an=el.animate(frames,opts);return an.finished.then(function(){el.style.transition='none';commit(el,last);try{an.cancel()}catch(e){}}).catch(function(){})}
function tapOn(el){return new Promise(function(r){if(ff())return r();var h=function(){el.removeEventListener('pointerup',h);r()};
  var t=setTimeout(function(){el.addEventListener('pointerup',h)},250);pend.push(function(){clearTimeout(t);el.removeEventListener('pointerup',h);r()})})}
function ss(a,b,v){v=Math.max(0,Math.min(1,(v-a)/(b-a)));return v*v*(3-2*v)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

  var L3=[['When the hero Perseus defeated Medusa, I sprang into the world.','英雄ペルセウスがメドゥーサをたおしたとき、ぼくは生まれた。'],['With the hero Bellerophon, I defeated the fire-breathing Chimera.','英雄ベレロフォンといっしょに、火をはく怪物キマイラをたおした。'],['But when he tried to fly to the home of the gods, he fell. I flew on, and Zeus placed me among the stars.','でも、神々の山へ行こうとして、彼は落ちてしまった。ぼくは飛びつづけ、ゼウスがぼくを星にした。']];
  var h='<div class="bh serif">Awakened</div><div class="bd serif">'+en+' · Full moon</div><div class="bdj jaf">'+ja+'　満月の夜</div><div class="bhr"></div>';
  L3.forEach(function(p){h+='<div class="bl serif">'+p[0]+'</div><div class="blj jaf">'+p[1]+'</div>'});
  h+='<button class="bbtn serif" id="again">▶ Watch again · もう一度見る</button>';Q('bscroll').innerHTML=h;
  Q('again').onclick=function(e){e.stopPropagation();var p=new URLSearchParams(location.search);p.delete('act');location.search=p.toString()}}
function cardMode(){
  cardOn=true;base=null;tx=ty=0;sizeVars();buildBack();askMotion();
  Q('hint').innerHTML='<svg viewBox="0 0 40 60"><rect x="8" y="4" width="24" height="44" rx="4" fill="none" stroke="#f3dfa6" stroke-width="2"/><circle cx="20" cy="42" r="1.6" fill="#f3dfa6"/><path d="M4 54 Q20 60 36 54" fill="none" stroke="#d9bb72" stroke-width="1.5"/></svg><div class="en serif">Tilt to wake Pegasus</div><div class="ja jaf">かたむけて、ペガススをめざめさせよう</div>';
  Q('hint').style.transition='opacity .8s';Q('hint').style.opacity=1;
  var t0=performance.now(),hintGone=false,btnsOn=false,last=performance.now();
  setTimeout(shootingStar,DEBUG?3000:15000);
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    cx+=(tx-cx)*0.12;cy+=(ty-cy)*0.12;var t=clamp(Math.hypot(cx,cy),0,1);
    if(t>0.3)tiltTime+=dt;
    if(!hintGone&&t>0.45){hintGone=true;Q('hint').style.opacity=0}
    if(!btnsOn&&(tiltTime>4||now-t0>10000)){btnsOn=true;var b=Q('btns');b.style.transition='opacity .8s';b.style.opacity=1;b.style.pointerEvents='auto'}
    cardEl.style.transform='rotateY('+(cx*10).toFixed(2)+'deg) rotateX('+(-cy*8).toFixed(2)+'deg)';
    Q('cshadow').style.transform='translate('+(-cx*5).toFixed(2)+'%,'+(-cy*4).toFixed(2)+'%) scale('+(1-t*.05).toFixed(3)+')';
    if(!flipped){
      Q('csky').style.transform='translate('+(-cx*1.4).toFixed(2)+'%,'+(-cy*1.4).toFixed(2)+'%) scale(1.06)';
      var nb=Q('cnebO');nb.style.opacity=(0.74-0.6*ss(0.15,0.9,t)).toFixed(3);nb.style.transform='translate('+(-cx*.5).toFixed(2)+'%,'+(-cy*.5).toFixed(2)+'%) scale(1.03)';
      var rv=ss(0.28,0.92,t);
      Q('cfg').style.transform='translate('+(cx*1).toFixed(2)+'%,'+(cy*1).toFixed(2)+'%) scale('+(1+0.025*rv).toFixed(4)+')';
      Q('ccre').style.opacity=rv.toFixed(3);
      D.stars.forEach(function(s){var p=clamp((t-0.06-Math.max(0,(s.mag-2)*0.1))/0.55,0,1),g=C.glows[s.n];
        g.style.transform='translate(-50%,-50%) scale('+(p*2.2).toFixed(3)+')';g.style.opacity=(Math.sin(Math.PI*Math.min(1,p*1.05))*0.85).toFixed(3);
        C.els[s.n].style.transform='translate(-50%,-50%) scale('+(1.1+0.45*ss(0.05,0.5,t)-0.15*rv).toFixed(3)+')'});
      Q('cLines').style.opacity=((1-ss(0.1,0.6,t))*0.42).toFixed(3);
      var sh=Q('csheen');sh.style.opacity=(0.2+0.8*t).toFixed(3);sh.style.transform='translate('+(cx*22).toFixed(2)+'%,'+(cy*14).toFixed(2)+'%)';
      var p=clamp(0.5+cx*0.55+cy*0.3,0,1)*3,inten=0.3+0.7*t;
      foils.forEach(function(f,k){f.style.opacity=(Math.max(0,1-Math.abs(p-k))*inten).toFixed(3)});
      var target=t>0.06?Math.atan2(cx,-cy)*180/Math.PI:0,diff=((target-ang+540)%360)-180;ang+=diff*0.1;
      var pp=dialPos(ang);
      Q('ptr').style.transform='translate('+(pp[0]*CW).toFixed(1)+'px,'+(pp[1]*CH).toFixed(1)+'px) rotate('+ang.toFixed(1)+'deg)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
Q('flipB').onclick=function(e){e.stopPropagation();flipped=!flipped;base=null;Q('flipper').style.transform=flipped?'rotateY(180deg)':'rotateY(0deg)';this.textContent=flipped?'↻ Flip · おもて':'↻ Flip · うら';tx=ty=0};
Q('doneB').onclick=function(e){e.stopPropagation();var p=new URLSearchParams(location.search);p.delete('act');location.search=p.toString()};

/* ================= start, fullscreen, wake lock, skip ================= */
var wakeLock=null;
function keepAwake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wakeLock=l}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&wakeLock)keepAwake()});
function goFull(){try{var d=document.documentElement,r=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):(d.webkitRequestFullscreen&&d.webkitRequestFullscreen());
  if(r&&r.then)r.then(function(){try{screen.orientation.lock('portrait').catch(function(){})}catch(e){}}).catch(function(){})}catch(e){}}
Q('go').onclick=function(e){e.stopPropagation();goFull();keepAwake();askMotion();run().catch(function(er){showErr(er.message)})};
Q('reset').onclick=function(e){e.stopPropagation();localStorage.removeItem(SEEN_KEY);this.textContent='Reset ✓ (next run is a first viewing)'};
Q('skip').onclick=function(e){e.stopPropagation();ffUntil=9;this.style.display='none';
  try{document.getAnimations().forEach(function(a){var it=a.effect&&a.effect.getTiming&&a.effect.getTiming().iterations;if(it!==Infinity){try{a.finish()}catch(_){}}})}catch(_){}
  var p=pend;pend=[];p.forEach(function(f){f()})};

addEventListener('resize',checkRot);checkRot();

var srcs=['skytall','moon','nebula','creature','frame','sky','foil0','foil1','foil2','foil3'].map(function(n){return 'assets/'+n+'.webp'});
Promise.all(srcs.map(function(s){return new Promise(function(r){var im=new Image();im.onload=im.onerror=function(){(im.decode?im.decode():Promise.resolve()).then(r,r)};im.src=s})})).then(function(){
  Q('loading').style.display='none';Q('go').style.display='inline-block';
  if(DEBUG&&START_ACT){ffUntil=START_ACT;run().catch(function(er){showErr(er.message)})}
});

if(DEBUG){var dbg=Q('dbg');dbg.style.display='block';
  var h='<b id="dAct">Act 0</b><br>Jump: ';for(var a=1;a<=9;a++)h+='<button data-a="'+a+'">'+a+'</button>';
  h+='<br>Speed: ';[1,2,4].forEach(function(s){h+='<button data-s="'+s+'" class="'+(s===SPEED?'on':'')+'">'+s+'×</button>'});
  h+='<br><button id="dNames">star names</button><button id="dEye">eye marker</button><br><span style="opacity:.7">Tap the art to read x/y</span>';
  dbg.innerHTML=h;

  dbg.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){var p=new URLSearchParams(location.search);p.set('act',b.dataset.a);location.search=p.toString()}});
  dbg.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){var p=new URLSearchParams(location.search);p.set('speed',b.dataset.s);location.search=p.toString()}});

  stage.addEventListener('pointerdown',function(e){var box=(cardOn?Q('cart'):Q('art')).getBoundingClientRect();var x=(e.clientX-box.left)/box.width,y=(e.clientY-box.top)/box.height;
    if(x<0||x>1||y<0||y>1)return;var tip=Q('dTip'),s=srect();tip.style.display='block';tip.style.left=(e.clientX-s.left+8)+'px';tip.style.top=(e.clientY-s.top-24)+'px';tip.textContent='x '+x.toFixed(3)+'  y '+y.toFixed(3)},true);
}
})();
