<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSR · China frame demo · Qin Shi Huang</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0a0e20;color:#dfe6ff;font-family:system-ui,-apple-system,sans-serif;padding:20px}
  h1{font-size:16px;margin:0 0 4px;color:#ffd76a}
  .sub{font-size:12px;color:#9aa6d8;margin:0 0 16px;max-width:760px;line-height:1.5}
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  .bar button{background:#1d2445;border:1px solid #3b4680;color:#dfe6ff;border-radius:99px;padding:7px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .bar label{font-size:12px;color:#9aa6d8;display:flex;align-items:center;gap:8px}
  .row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .item h2{font-size:13px;margin:0;color:#7fe7ff}
  .card{position:relative;width:300px;height:420px;border-radius:14px;overflow:hidden;background:#111;
        box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12)}
  .card img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card .frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
  .card .holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.3;
      -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
      background:linear-gradient(115deg,#ff4d6d 0%,#ffb34d 14%,#f6ff6a 28%,#5dffb0 42%,#4dd2ff 56%,#8a6bff 70%,#ff5dd8 84%,#ff4d6d 100%);
      background-size:260% 260%;animation:shimmer 7s linear infinite}
  .card .holo.a{-webkit-mask-image:url(frame_original.png);mask-image:url(frame_original.png)}
  .card .holo.b{-webkit-mask-image:url(frame_adjusted.png);mask-image:url(frame_adjusted.png)}
  .holoOff .holo{display:none}
  .card .name{position:absolute;left:12px;right:12px;bottom:12px;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000;text-align:center}
  @keyframes shimmer{to{background-position:200% 50%}}
  @media (prefers-reduced-motion:reduce){.card .holo{animation:none}}
</style>
</head>
<body>
  <h1>SSR · China frame · Qin Shi Huang</h1>
  <p class="sub">Left: frame as generated. Right: corner smoke lightened and the frame at 60%. The holo shimmers only through the frame lines. Use the slider to change the frame strength on both cards.</p>

  <div class="bar">
    <button id="tHolo" aria-pressed="true">Holo shimmer: on</button>
    <label>Frame strength
      <input id="strength" type="range" min="20" max="100" value="60">
      <span id="sv">60%</span>
    </label>
  </div>

  <div class="row">
    <div class="item">
      <h2>As generated</h2>
      <div class="card" data-card>
        <img class="art" src="../../assets/cards/cn01.2494d666.webp" alt="Qin Shi Huang">
        <img class="frame" src="frame_original.png" alt="" data-frame>
        <div class="holo a"></div>
        <div class="name">Qin Shi Huang</div>
      </div>
    </div>
    <div class="item">
      <h2>Adjusted</h2>
      <div class="card" data-card>
        <img class="art" src="../../assets/cards/cn01.2494d666.webp" alt="Qin Shi Huang">
        <img class="frame" src="frame_adjusted.png" alt="" data-frame style="opacity:.6">
        <div class="holo b"></div>
        <div class="name">Qin Shi Huang</div>
      </div>
    </div>
  </div>

<script>
  var cards = document.querySelectorAll('[data-card]');
  var frames = document.querySelectorAll('[data-frame]');
  var slider = document.getElementById('strength'), sv = document.getElementById('sv');
  var tHolo = document.getElementById('tHolo');
  // the adjusted frame's base opacity is 0.6, so the slider scales both frames from their own base
  slider.addEventListener('input', function(){
    var k = slider.value / 100;
    frames[0].style.opacity = k.toFixed(2);
    frames[1].style.opacity = (0.6 * k).toFixed(2);
    sv.textContent = slider.value + '%';
  });
  tHolo.addEventListener('click', function(){
    var on = tHolo.getAttribute('aria-pressed') !== 'true';
    tHolo.setAttribute('aria-pressed', on ? 'true' : 'false');
    tHolo.textContent = 'Holo shimmer: ' + (on ? 'on' : 'off');
    cards.forEach(function(c){ c.classList.toggle('holoOff', !on); });
  });
</script>
</body>
</html>
